<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q&A GPT • Admissions Help Desk</title>
    <style>
      :root{
        --bg: #0b1220;
        --card: rgba(255,255,255,.06);
        --card2: rgba(255,255,255,.08);
        --text: rgba(255,255,255,.92);
        --muted: rgba(255,255,255,.65);
        --border: rgba(255,255,255,.10);
        --shadow: 0 14px 40px rgba(0,0,0,.35);

        --brand1: #7c3aed;
        --brand2: #06b6d4;

        --assistant: rgba(255,255,255,.10);
        --assistantText: rgba(255,255,255,.92);

        --userBg: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
        --userText: #ffffff;

        --radius: 18px;
      }

      *{ box-sizing:border-box; }
      html, body { height: 100%; }
      body{
        margin:0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
        color: var(--text);
        background:
          radial-gradient(900px 500px at 10% 0%, rgba(124,58,237,.30), transparent 55%),
          radial-gradient(900px 500px at 100% 10%, rgba(6,182,212,.22), transparent 55%),
          var(--bg);
      }

      .page{
        height: 100%;
        display:flex;
        flex-direction:column;
        max-width: 980px;
        margin: 0 auto;
      }

      .header{
        padding: 14px 14px 10px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap: 10px;
      }

      .title{
        display:flex;
        flex-direction:column;
        gap:4px;
        min-width: 0;
      }
      .title h1{
        margin:0;
        font-size: 16px;
        letter-spacing: .2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .title .sub{
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .pill{
        font-size: 12px;
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(124,58,237,.18);
        border: 1px solid rgba(124,58,237,.30);
        color: rgba(255,255,255,.9);
        white-space: nowrap;
      }

      .card{
        flex: 1;
        margin: 0 12px 12px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, var(--card), rgba(255,255,255,.03));
        box-shadow: var(--shadow);
        overflow:hidden;
        display:flex;
        flex-direction:column;
        min-height: 0; /* important for flex scroll */
      }

      .topbar{
        padding: 12px 12px;
        display:flex;
        align-items:center;
        gap: 10px;
        border-bottom: 1px solid var(--border);
        background: rgba(255,255,255,.04);
      }

      .avatar{
        width: 34px; height: 34px;
        border-radius: 12px;
        display:grid;
        place-items:center;
        font-weight: 800;
        background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(6,182,212,.9));
        color: #fff;
        flex: 0 0 auto;
      }

      .meta{ line-height: 1.15; min-width: 0; }
      .meta .name{ font-weight: 750; font-size: 13px; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
      .meta .status{ font-size: 12px; color: var(--muted); }

      #box{
        flex: 1;
        overflow:auto;
        padding: 14px 12px;
        min-height: 0;
      }

      .row{ display:flex; margin: 10px 0; }
      .row.assistant{ justify-content:flex-start; }
      .row.user{ justify-content:flex-end; }

      .bubble{
        max-width: 86%;
        padding: 12px 12px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: 0 8px 18px rgba(0,0,0,.20);
        font-size: 14.5px;
        line-height: 1.45;
        word-wrap: break-word;
        white-space: pre-wrap;
      }
      .assistant .bubble{
        background: var(--assistant);
        color: var(--assistantText);
        border-top-left-radius: 10px;
      }
      .user .bubble{
        background: var(--userBg);
        color: var(--userText);
        border: none;
        border-top-right-radius: 10px;
      }

      .time{
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted);
        padding: 0 6px;
      }

      .composer{
        padding: 10px;
        border-top: 1px solid var(--border);
        background: rgba(10,16,30,.92);
        backdrop-filter: blur(10px);
      }

      .bar{
        display:flex;
        gap: 10px;
        align-items:flex-end;
      }

      textarea{
        flex:1;
        resize:none;
        min-height: 46px;
        max-height: 140px;
        padding: 12px 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        outline: none;
        font-family: inherit;
        font-size: 14.5px;
        background: rgba(255,255,255,.06);
        color: var(--text);
      }
      textarea::placeholder{ color: rgba(255,255,255,.55); }
      textarea:focus{
        border-color: rgba(6,182,212,.55);
        box-shadow: 0 0 0 4px rgba(6,182,212,.12);
      }

      button{
        padding: 12px 14px;
        border-radius: 14px;
        border: none;
        cursor:pointer;
        font-weight: 750;
        color: #fff;
        background: linear-gradient(135deg, var(--brand1), var(--brand2));
        box-shadow: 0 12px 22px rgba(124,58,237,.20);
        min-width: 86px;
      }
      button:disabled{ opacity: .6; cursor:not-allowed; }

      .footerNote{
        margin-top: 8px;
        text-align:center;
        font-size: 12px;
        color: var(--muted);
      }

      .dots{ display:inline-flex; gap:4px; align-items:center; }
      .dot{
        width:6px; height:6px; border-radius:999px;
        background: rgba(255,255,255,.70);
        animation: blink 1.2s infinite ease-in-out;
      }
      .dot:nth-child(2){ animation-delay: .15s; }
      .dot:nth-child(3){ animation-delay: .30s; }
      @keyframes blink{
        0%, 80%, 100% { opacity: .25; transform: translateY(0); }
        40% { opacity: .95; transform: translateY(-2px); }
      }

      /* Mobile: make it feel like an app */
      @media (max-width: 520px){
        .header{ padding: 12px 12px 8px; }
        .pill{ display:none; }
        .card{ margin: 0; border-radius: 0; border-left:0; border-right:0; }
        .bubble{ max-width: 92%; }
        #box{ padding: 12px 10px; }
        .composer{ padding: 10px; }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <div class="header">
        <div class="title">
          <h1>Admissions Help Desk</h1>
          <div class="sub">Chat with Q&A GPT • Fast replies</div>
        </div>
        <div class="pill">Powered by Vapi</div>
      </div>

      <div class="card">
        <div class="topbar">
          <div class="avatar">Q</div>
          <div class="meta">
            <div class="name">Q&A GPT</div>
            <div class="status">Online</div>
          </div>
        </div>

        <div id="box"></div>

        <div class="composer">
          <div class="bar">
            <textarea id="msg" placeholder="Type your message… (Enter to send, Shift+Enter for new line)"></textarea>
            <button id="send">Send</button>
          </div>
          <div class="footerNote">New chat = refresh page.</div>
        </div>
      </div>
    </div>

    <script>
      const box = document.getElementById("box");
      const msg = document.getElementById("msg");
      const sendBtn = document.getElementById("send");

      // New session per page load (memory only for this tab)
      let currentSessionId = null;

      function nowTime() {
        const d = new Date();
        return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }

      function escapeHtml(s) {
        return (s || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function addBubble(kind, text) {
        const row = document.createElement("div");
        row.className = `row ${kind}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = text;

        const wrap = document.createElement("div");
        wrap.appendChild(bubble);

        const t = document.createElement("div");
        t.className = "time";
        t.textContent = nowTime();
        wrap.appendChild(t);

        row.appendChild(wrap);
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
        return row;
      }

      function typingRow() {
        return addBubble(
          "assistant",
          `<span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`
        );
      }

      async function send() {
        const text = msg.value.trim();
        if (!text) return;

        msg.value = "";
        msg.style.height = "46px";

        addBubble("user", escapeHtml(text));

        const typingEl = typingRow();
        sendBtn.disabled = true;

        try {
          const resp = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              sessionId: currentSessionId
            })
          });

          const data = await resp.json();
          typingEl.remove();
          sendBtn.disabled = false;

          if (data?.sessionId) currentSessionId = data.sessionId;

          if (!resp.ok) {
            addBubble("assistant", escapeHtml(data?.error || "Error"));
            return;
          }

          // Show only the last assistant message (clean UI)
          const replies = Array.isArray(data.replies) ? data.replies : [data.reply];
          const clean = replies.filter(Boolean);

          if (!clean.length) addBubble("assistant", "…");
          else addBubble("assistant", escapeHtml(clean[clean.length - 1]));
        } catch (e) {
          typingEl.remove();
          sendBtn.disabled = false;
          addBubble("assistant", "Network error. Please try again.");
        }
      }

      msg.addEventListener("input", () => {
        msg.style.height = "auto";
        msg.style.height = Math.min(msg.scrollHeight, 140) + "px";
      });

      sendBtn.onclick = send;
      msg.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      addBubble("assistant", "Hi! I’m Q&A GPT. Please tell me your full name to get started.");
    </script>
  </body>
</html>
